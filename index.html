<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão Financeira Sincronizada</title>
  <style>
    :root { --primary: #1a73e8; --success: #34a853; --danger: #ea4335; --warning: #d97706; --bg: #f8f9fa; --card: #ffffff; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #333; }
    .container { max-width: 1100px; margin: 0 auto; }
    h1, h2, h3 { color: #202124; margin-top: 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 15px; margin-bottom: 20px; }
    .card { background: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .metric { font-size: 1.6rem; font-weight: bold; margin-top: 8px; }
    .metric.positive { color: var(--success); }
    .metric.negative { color: var(--danger); }
    .metric.warning { color: var(--warning); }
    .status-cloud { font-size: 0.85rem; color: #1a73e8; font-weight: bold; margin-bottom: 10px; }
    form { display: grid; gap: 10px; }
    input, select, button { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; }
    button { background: var(--primary); color: white; border: none; cursor: pointer; font-weight: bold; }
    button:hover { opacity: 0.9; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid #ddd; }
    .btn-danger { background: #dc3545; padding: 4px 8px; font-size: 0.8rem; border-radius: 4px; cursor: pointer; color: white; border: none; }
  </style>
</head>
<body>
  <div class="container">
    <div id="statusNuvem" class="status-cloud">🔄 Inicializando sistema...</div>
    <h1>Controle Financeiro Sincronizado</h1>
    
    <div class="grid">
      <div class="card">
        <h3>Saldo Líquido C6 (Conta)</h3>
        <div id="saldoC6" class="metric warning">R$ 71,59</div>
      </div>
      <div class="card">
        <h3>Investimentos Bloqueados</h3>
        <div class="metric">R$ 408,43</div>
      </div>
      <div class="card">
        <h3>Dívidas Mapeadas</h3>
        <div id="dividaTotal" class="metric negative">R$ 12.515,00</div>
      </div>
      <div class="card">
        <h3>Meta Civic Gen10</h3>
        <div class="metric">R$ 120.000,00</div>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <h3>Lançar Gastos / Entradas</h3>
        <form id="formLancamento">
          <input type="date" id="data" required>
          <input type="text" id="descricao" placeholder="Descrição (ex: Aluguel Matheus)" required>
          <input type="number" step="0.01" id="valor" placeholder="Valor (R$)" required>
          <select id="tipo">
            <option value="entrada">Entrada de Dinheiro (+)</option>
            <option value="gasto">Gasto Diário (-)</option>
            <option value="divida">Pagamento de Dívida (-)</option>
          </select>
          <button type="submit">Registrar</button>
        </form>
      </div>
      <div class="card">
        <h3>Histórico de Lançamentos</h3>
        <table>
          <thead><tr><th>Data</th><th>Descrição</th><th>Tipo</th><th>Valor</th><th>Ação</th></tr></thead>
          <tbody id="tabelaLancamentos"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // COLE AS SUAS CREDENCIAIS REAIS AQUI ABAIXO
    // ==========================================
    const BIN_ID = "6ab1d19fac6210605ae7ad36"; 
    const MASTER_KEY = "$2a$10$I3LFh/GVHV2qLDcDbi5CV.frNBeyAszAomJinXBVkp4.nGdcYc7T.";
    const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

    let dados = JSON.parse(localStorage.getItem('financasSystemData')) || {
      dividaTotal: 12515.00,
      saldoC6: 71.59,
      lancamentos: []
    };

    // 1. Atualiza a UI imediatamente (Offline-First)
    function atualizarInterface() {
      let dividaAtual = 12515.00;
      let c6 = 71.59;

      dados.lancamentos.forEach(l => {
        if(l.tipo === 'divida') dividaAtual -= l.valor;
        if(l.tipo === 'gasto') c6 -= l.valor;
        if(l.tipo === 'entrada') c6 += l.valor;
      });

      document.getElementById('dividaTotal').innerText = `R$ ${Math.max(0, dividaAtual).toFixed(2)}`;
      const elSaldo = document.getElementById('saldoC6');
      elSaldo.innerText = `R$ ${Math.max(0, c6).toFixed(2)}`;
      elSaldo.className = c6 >= 500 ? "metric positive" : "metric warning";

      const tbody = document.getElementById('tabelaLancamentos');
      tbody.innerHTML = '';
      dados.lancamentos.slice().reverse().forEach((l, index) => {
        const realIndex = dados.lancamentos.length - 1 - index;
        const tipoFmt = l.tipo === 'entrada' ? 'Entrada (+)' : (l.tipo === 'gasto' ? 'Gasto (-)' : 'Dívida (-)');
        tbody.innerHTML += `<tr><td>${l.data}</td><td>${l.descricao}</td><td>${tipoFmt}</td><td>R$ ${l.valor.toFixed(2)}</td><td><button class="btn-danger" onclick="removerLancamento(${realIndex})">X</button></td></tr>`;
      });

      localStorage.setItem('financasSystemData', JSON.stringify(dados));
    }

    // 2. Sincroniza em background sem travar a tela
    async function salvarNaNuvem() {
      if (BIN_ID === "SEU_BIN_ID") {
        document.getElementById('statusNuvem').innerText = "⚠️ Dados salvos apenas localmente. Insira a chave do JSONBin no código.";
        return;
      }
      document.getElementById('statusNuvem').innerText = "⏳ Sincronizando...";
      try {
        await fetch(API_URL, {
          method: "PUT",
          headers: { "Content-Type": "application/json", "X-Master-Key": MASTER_KEY },
          body: JSON.stringify(dados)
        });
        document.getElementById('statusNuvem').innerText = "☁️ Nuvem Sincronizada";
      } catch(e) {
        document.getElementById('statusNuvem').innerText = "⚠️ Erro de rede. Salvo localmente.";
      }
    }

    async function carregarDaNuvem() {
      if (BIN_ID === "SEU_BIN_ID") {
        document.getElementById('statusNuvem').innerText = "⚠️ Rodando Local (Sem Nuvem). Insira suas chaves.";
        atualizarInterface();
        return;
      }
      try {
        const res = await fetch(API_URL, { headers: { "X-Master-Key": MASTER_KEY } });
        if(res.ok) {
          const json = await res.json();
          if(json.record && json.record.lancamentos !== undefined) {
            dados = json.record;
            document.getElementById('statusNuvem').innerText = "☁️ Nuvem Sincronizada";
          }
        }
      } catch(e) {
        document.getElementById('statusNuvem').innerText = "⚠️ Usando dados offline.";
      }
      atualizarInterface();
    }

    // 3. Captura do Formulário à prova de quebra
    document.getElementById('formLancamento').addEventListener('submit', (e) => {
      e.preventDefault();
      
      const novoLancamento = {
        data: document.getElementById('data').value,
        descricao: document.getElementById('descricao').value,
        valor: parseFloat(document.getElementById('valor').value),
        tipo: document.getElementById('tipo').value
      };

      dados.lancamentos.push(novoLancamento);
      
      // Atualiza a tela primeiro, garantindo a UX
      atualizarInterface();
      e.target.reset();
      document.getElementById('data').valueAsDate = new Date();
      
      // Sincroniza em background depois
      salvarNaNuvem();
    });

    window.removerLancamento = function(index) {
      dados.lancamentos.splice(index, 1);
      atualizarInterface();
      salvarNaNuvem();
    };

    document.getElementById('data').valueAsDate = new Date();
    carregarDaNuvem();
  </script>
</body>
</html>
